<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FFXI Inventory Command</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">VALEFOR Â· SIX-CHARACTER ROSTER</p>
      <h1>Inventory Command</h1>
      <p class="subtitle">Dense bag view Â· FindAll + local BG Wiki + Valefor market history</p>
    </div>
    <button id="refresh">Reload view</button>
  </header>
  <main>
    <nav class="tabbar" aria-label="Inventory Command views">
      <button class="tab active" data-tab="inventory-tab">Inventory</button>
      <button class="tab" data-tab="key-items-tab">Key Items</button>
      <button class="tab" data-tab="currencies-tab">Currencies</button>
    </nav>
    <section id="inventory-tab" class="tab-panel active">
      <section class="dashboard">
        <div class="section-heading">
          <div><p class="eyebrow">PARTY DASHBOARD</p><h2>At a glance</h2></div>
          <p id="dashboard-time" class="muted"></p>
        </div>
        <div id="gil-board" class="gil-board"></div>
        <div id="limbus-board" class="limbus-board"></div>
      </section>
    <section id="summary" class="summary"></section>
    <section class="panel controls">
      <label>Search <input id="search" placeholder="Item name"></label>
      <label>Character
        <select id="character"><option value="">All six</option></select>
      </label>
      <label>Recommendation
        <select id="action"><option value="">All</option><option>KEEP</option><option>UPGRADE</option><option>AH</option><option>HOLD</option><option>REVIEW</option><option>VENDOR</option><option>DROP</option></select>
      </label>
      <fieldset>
        <legend>Status behavior</legend>
        <label class="choice"><input type="radio" name="status-mode" value="highlight" checked> Highlight</label>
        <label class="choice"><input type="radio" name="status-mode" value="only"> Only matching</label>
      </fieldset>
    </section>
    <section id="bag-board" class="bag-board" aria-live="polite"></section>
    <p id="empty" class="panel empty" hidden>No matching inventory.</p>
    <section class="panel status-panel">
      <div><p class="eyebrow">DATA HEALTH</p><h2>Sources</h2></div>
      <div id="status" class="status"></div>
    </section>
    </section>
    <section id="key-items-tab" class="tab-panel" hidden>
      <section class="panel list-tools">
        <label>Search key items <input id="key-search" placeholder="Key item name"></label>
      </section>
      <section id="key-items-board" class="matrix-board" aria-live="polite"></section>
    </section>
    <section id="currencies-tab" class="tab-panel" hidden>
      <section class="panel list-tools">
        <label>Search currencies <input id="currency-search" placeholder="Currency name"></label>
      </section>
      <section id="currencies-board" class="matrix-board" aria-live="polite"></section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
