<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FFXI Inventory Command</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">VALEFOR Â· SIX-CHARACTER ROSTER</p>
      <h1>Inventory Command</h1>
      <p class="subtitle">Dense bag view Â· FindAll + local BG Wiki + Valefor market history</p>
    </div>
    <button id="refresh">Reload view</button>
  </header>
  <main>
    <section id="summary" class="summary"></section>
    <section class="panel controls">
      <label>Search <input id="search" placeholder="Item name"></label>
      <label>Character
        <select id="character"><option value="">All six</option></select>
      </label>
      <label>Recommendation
        <select id="action"><option value="">All</option><option>KEEP</option><option>UPGRADE</option><option>AH</option><option>HOLD</option><option>REVIEW</option><option>VENDOR</option><option>DROP</option></select>
      </label>
      <fieldset>
        <legend>Status behavior</legend>
        <label class="choice"><input type="radio" name="status-mode" value="highlight" checked> Highlight</label>
        <label class="choice"><input type="radio" name="status-mode" value="only"> Only matching</label>
      </fieldset>
    </section>
    <section id="bag-board" class="bag-board" aria-live="polite"></section>
    <p id="empty" class="panel empty" hidden>No matching inventory.</p>
    <section class="panel status-panel">
      <div><p class="eyebrow">DATA HEALTH</p><h2>Sources</h2></div>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
