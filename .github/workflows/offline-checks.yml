name: Offline source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked Lua test tools
        run: ./tools/OfflineTests/Initialize.ps1 -NodeExe (Get-Command node).Source
      - name: Run ten offline suites
        run: ./tools/OfflineTests/Invoke-Checks.ps1 -NodeExe (Get-Command node).Source -PythonExe (Get-Command python).Source
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-check-results
          path: tools/OfflineTests/reports/
          if-no-files-found: warn
          retention-days: 14
